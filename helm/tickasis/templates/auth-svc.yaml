kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app: {{ .Release.Name }}-auth
  namespace: {{ .Release.Namespace }}
spec:
    type: {{ .Values.service.auth.type }}
    selector:
        app: {{ .Release.Name }}-auth
    ports:
        - protocol: TCP
          port: {{ .Values.service.auth.port }}
          targetPort: {{ .Values.service.auth.targetPort }}