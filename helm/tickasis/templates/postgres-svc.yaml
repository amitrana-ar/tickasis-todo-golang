kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
spec:
    type: {{ .Values.service.postgres.type }}
    selector:
        app: {{ .Release.Name }}-postgres
    ports:
        - protocol: TCP
          port: {{ .Values.service.postgres.port }}
          targetPort: {{ .Values.service.postgres.targetPort }}