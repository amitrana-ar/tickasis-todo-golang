kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
spec:
    type: {{ .Values.service.frontend.type }}
    selector:
        app: {{ .Release.Name }}-frontend
    ports:
        - protocol: TCP
          port: {{ .Values.service.frontend.port }}
          targetPort: {{ .Values.service.frontend.targetPort }}