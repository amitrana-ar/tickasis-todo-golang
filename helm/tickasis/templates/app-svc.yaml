kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: {{ .Release.Name }}-app
  namespace: {{ .Release.Namespace }}
spec:
    type: {{ .Values.service.type }}
    selector:
        app: {{ .Release.Name }}-app
    ports:
        - protocol: TCP
          port: {{ .Values.service.app.port }}
          targetPort: {{ .Values.service.app.targetPort }}